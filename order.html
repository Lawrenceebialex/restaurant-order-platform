<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Order · Leva</title>
  <meta name="theme-color" content="#111827" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/storefront.css" />
</head>
<body>
  <div id="sfBrowse">
    <header class="sf-header">
      <div class="sf-header-inner">
        <img id="sfLogo" class="sf-logo" src="" alt="" />
        <div class="sf-brand-meta">
          <div class="sf-brand-name" id="sfName">Loading…</div>
          <div class="sf-brand-sub"><span class="sf-open-dot" id="sfDot"></span><span id="sfStatusText">Open</span><span> · via Leva</span></div>
        </div>
        <div class="sf-header-actions">
          <button type="button" class="sf-icon-btn" id="sfCartBtn" aria-label="Cart"><span id="sfCartBadge" style="display:none">0</span>🛒</button>
          <button type="button" class="sf-icon-btn" id="sfMenuBtn" aria-label="Menu">☰</button>
        </div>
      </div>
    </header>
    <section class="sf-hero">
      <h1 id="sfHeroTitle">…</h1>
      <p id="sfHeroSub">Order for pickup or delivery</p>
      <p class="sf-meta"><span id="sfLoc"></span> · <span id="sfPhone"></span></p>
      <div class="sf-fulfill">
        <button type="button" data-fulfill="pickup">Pickup</button>
        <button type="button" data-fulfill="delivery">Delivery</button>
      </div>
    </section>
    <nav class="sf-cats" id="sfCats"></nav>
    <main class="sf-main" id="sfMain"></main>
  </div>
  <div id="sfCheckout" style="display:none">
    <header class="sf-header"><div class="sf-header-inner"><button type="button" id="sfBackBrowse">← Back</button><strong>Checkout</strong></div></header>
    <form id="sfCheckoutForm" class="sf-checkout">
      <div class="sf-field"><label for="sfCustName">Name</label><input id="sfCustName" required /></div>
      <div class="sf-field"><label for="sfCustPhone">Phone</label><input id="sfCustPhone" type="tel" required /></div>
      <div class="sf-field" id="sfLocField" style="display:none"><label for="sfCustLoc">Delivery location</label><input id="sfCustLoc" /></div>
      <div class="sf-pay">
        <label class="sf-pay-opt"><input type="radio" name="sfPay" value="paystack" checked /> <span><strong>Pay now</strong></span></label>
        <label class="sf-pay-opt" id="sfPodOpt" style="display:none"><input type="radio" name="sfPay" value="pod" /> <span><strong>Pay on delivery</strong></span></label>
      </div>
      <div class="sf-field"><label for="sfNote">Note</label><textarea id="sfNote" rows="2"></textarea></div>
      <div class="sf-summary">
        <div class="sf-summary-row"><span>Subtotal</span><span id="sfSumSub">₦0</span></div>
        <div class="sf-summary-row" id="sfSumFeeRow" style="display:none"><span>Pickup fee</span><span id="sfSumFee">₦600</span></div>
        <div class="sf-summary-row total"><span>Total</span><span id="sfSumTotal">₦0</span></div>
      </div>
      <button type="submit" class="sf-primary-btn">Place order</button>
    </form>
  </div>
  <div class="sf-success" id="sfSuccess">
    <div class="sf-success-icon">✓</div><h2>Order placed</h2>
    <div class="sf-order-id" id="sfOrderId">—</div>
    <button type="button" class="sf-ghost-btn" id="sfCopyId">Copy ID</button>
    <button type="button" class="sf-primary-btn" onclick="location.reload()">Back to menu</button>
  </div>
  <div class="sf-cartbar" id="sfCartbar"><button type="button" class="sf-cartbar-btn" id="sfCartbarBtn"><span id="sfCartbarLabel">0 items</span><span id="sfCartbarTotal">₦0</span></button></div>
  <div class="sf-backdrop" id="sfBackdrop"></div>
  <div class="sf-sheet" id="sfCustomize"><div class="sf-sheet-handle"></div><div class="sf-sheet-body" id="sfCustomizeBody"></div></div>
  <div class="sf-sheet" id="sfCartSheet"><div class="sf-sheet-handle"></div><div class="sf-sheet-body"><div class="sf-sheet-head"><h2>Your cart</h2><button type="button" class="sf-sheet-close" id="sfCloseCart">&times;</button></div><div id="sfCartBody"></div></div></div>
  <div class="sf-menu-panel" id="sfMenuPanel">
    <button type="button" onclick="document.getElementById('sfMenuPanel').classList.remove('open');document.getElementById('sfBackdrop').classList.remove('show')">Close</button>
    <a data-staff-link href="/staff.html">Staff dashboard</a><a href="/">Leva home</a>
  </div>
  <script src="/js/tenant.js"></script>
  <script src="/js/storefront.js"></script>
  <script src="/js/logo-apply.js"></script>
</body>
</html>
