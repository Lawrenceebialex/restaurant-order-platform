<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Victorious Mega Kitchen (VMK) | Order Now</title>
  <meta name="description" content="Order fresh Nigerian meals from Victorious Mega Kitchen. Pickup or Delivery around BIU & Ugbor." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Top Header -->
  <header class="header">
    <div class="header-inner">
      <div class="brand">
        <img src="https://i.postimg.cc/nzTsyQWk/1000605467-removebg-preview.png" alt="VMK Logo" class="logo" />
        <div class="brand-text">
          <span class="name">Victorious Mega Kitchen</span>
          <span class="tag">VMK • Ugbor</span>
        </div>
      </div>
      <button class="cart-btn" id="cartBtn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 6h15l-1.5 9h-12z"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/>
        </svg>
        <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <!-- Main -->
  <main class="main">
    <!-- Location + Order Type -->
    <section class="top-section">
      <div class="location-pill">
        <span class="dot"></span>
        Delivering to BIU & Ugbor
      </div>

      <div class="order-type">
        <button class="type-btn active" data-type="pickup">Pickup</button>
        <button class="type-btn" data-type="delivery">Delivery</button>
      </div>
    </section>

    <!-- Categories -->
    <section class="categories" id="categories">
      <button class="cat-btn active" data-cat="all">All</button>
      <button class="cat-btn" data-cat="rice">Rice</button>
      <button class="cat-btn" data-cat="swallow">Swallow</button>
      <button class="cat-btn" data-cat="soup">Soup</button>
      <button class="cat-btn" data-cat="proteins">Proteins</button>
      <button class="cat-btn" data-cat="sides">Sides</button>
      <button class="cat-btn" data-cat="pastries">Pastries</button>
    </section>

    <!-- Food Grid -->
    <section class="grid" id="foodGrid">
      <!-- Items injected by JS -->
    </section>
  </main>

  <!-- Sticky Cart Bar (mobile) -->
  <div class="cart-bar" id="cartBar">
    <div class="cart-bar-info">
      <span id="barCount">0 items</span>
      <strong id="barTotal">₦0</strong>
    </div>
    <button class="cart-bar-btn" id="viewCartBtn">View Cart</button>
  </div>

  <!-- Cart Drawer -->
  <div class="overlay" id="overlay"></div>
  <aside class="cart-drawer" id="cartDrawer">
    <div class="drawer-header">
      <h2>Your Order</h2>
      <button class="close-btn" id="closeCart">&times;</button>
    </div>
    <div class="drawer-body" id="cartItems">
      <p class="empty-cart">Your cart is empty</p>
    </div>
    <div class="drawer-footer">
      <div class="total-row">
        <span>Total</span>
        <strong id="drawerTotal">₦0</strong>
      </div>
      <button class="checkout-btn" id="checkoutBtn" disabled>Proceed to Checkout</button>
    </div>
  </aside>

  <script src="js/main.js"></script>
</body>
</html>
