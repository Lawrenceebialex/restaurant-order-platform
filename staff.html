<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Dashboard | VMK</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/staff.css" />
</head>
<body>
  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <img src="https://i.ibb.co/rfKhD4nY/1000605467-removebg-preview.png" alt="VMK" class="login-logo" />
      <h1>Staff Dashboard</h1>
      <p>Victorious Mega Kitchen</p>
      <input type="password" id="passwordInput" placeholder="Enter password" autocomplete="current-password" />
      <button type="button" id="loginBtn">Login</button>
      <p class="error" id="loginError" style="display:none;">Incorrect password</p>
    </div>
  </div>

  <div class="dashboard" id="dashboard" style="display:none;">
    <header class="dash-header">
      <div class="brand">
        <img src="https://i.ibb.co/rfKhD4nY/1000605467-removebg-preview.png" alt="VMK" />
        <span>Staff Dashboard</span>
      </div>
      <div class="header-right">
        <label class="sound-toggle" title="Play sound on new orders">
          <input type="checkbox" id="soundEnabled" checked />
          Sound alerts
        </label>
        <a class="kds-link" href="kds.html">Kitchen Display</a>
        <button type="button" class="logout-btn" id="logoutBtn">Logout</button>
      </div>
    </header>

    <div class="tabs">
      <button type="button" class="tab active" data-tab="orders">Orders</button>
      <button type="button" class="tab" data-tab="menu">Menu</button>
      <button type="button" class="tab" data-tab="status">Shop</button>
    </div>

    <section class="tab-content active" id="ordersTab">
      <div class="totals-bar" id="totalsBar">
        <div class="total-pills">
          <button type="button" class="range-btn active" data-range="daily">Today</button>
          <button type="button" class="range-btn" data-range="monthly">Month</button>
          <button type="button" class="range-btn" data-range="yearly">Year</button>
          <button type="button" class="range-btn" data-range="overall">All time</button>
        </div>
        <div class="totals-stats">
          <span><strong id="totalCount">0</strong> orders</span>
          <span>₦<strong id="totalRevenue">0</strong></span>
        </div>
      </div>

      <div class="section-header">
        <h2>Orders <span id="pollHint" class="poll-hint">Auto-refresh on</span></h2>
        <button type="button" class="refresh-btn" id="refreshOrdersBtn">Refresh</button>
      </div>

      <div class="search-row">
        <input type="search" id="orderSearch" placeholder="Search ID, phone, or name..." />
        <button type="button" class="refresh-btn" id="searchBtn">Search</button>
      </div>

      <div class="orders-list" id="ordersList">
        <p class="empty">Loading...</p>
      </div>
    </section>

    <section class="tab-content" id="menuTab">
      <div class="section-header">
        <h2>Menu Availability</h2>
        <p class="hint">Synced for all customers (D1)</p>
      </div>
      <div class="menu-controls" id="menuControls"></div>
    </section>

    <section class="tab-content" id="statusTab">
      <div class="section-header">
        <h2>Shop Open / Closed</h2>
        <p class="hint">Controls the status pill on the customer site</p>
      </div>
      <div class="shop-status-card">
        <p>Current status: <strong id="shopStatusLabel">Open</strong></p>
        <button type="button" class="refresh-btn" id="toggleShopBtn">Mark as Closed</button>
      </div>
    </section>
  </div>

  <div id="printRoot" class="print-root" aria-hidden="true"></div>

  <script src="js/staff.js"></script>
</body>
</html>
