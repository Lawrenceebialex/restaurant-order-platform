<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Menu · Leva</title>
  <meta name="theme-color" content="#0a0a0a" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --brand: #111827; --bg: #f7f5f0; --ink: #0a0a0a; --muted: #6b6560; --border: #e8e4dc; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .qm-top {
      background: #fff; border-bottom: 1px solid var(--border);
      padding: 14px 16px; display: flex; align-items: center; gap: 12px;
      position: sticky; top: 0; z-index: 10;
    }
    .qm-logo {
      width: 44px; height: 44px; border-radius: 12px; background: var(--brand); color: #fff;
      display: flex; align-items: center; justify-content: center; font-weight: 800; overflow: hidden; flex-shrink: 0;
    }
    .qm-logo img { width: 100%; height: 100%; object-fit: cover; }
    .qm-top h1 { font-size: 1.05rem; font-weight: 800; letter-spacing: -.02em; }
    .qm-top p { font-size: .78rem; color: var(--muted); }
    .qm-banner {
      margin: 14px 16px; padding: 12px 14px; background: #eef2ff; border-radius: 12px;
      font-size: .82rem; color: #3730a3; line-height: 1.45;
    }
    .qm-main { max-width: 520px; margin: 0 auto; padding: 8px 16px 48px; }
    .qm-sec { margin-bottom: 22px; }
    .qm-sec h2 {
      font-size: .72rem; text-transform: uppercase; letter-spacing: .06em;
      color: var(--muted); font-weight: 700; margin-bottom: 10px;
    }
    .qm-item {
      display: flex; justify-content: space-between; gap: 12px;
      background: #fff; border: 1px solid var(--border); border-radius: 14px;
      padding: 14px 14px; margin-bottom: 8px;
    }
    .qm-item strong { display: block; font-size: .95rem; }
    .qm-item .price { font-weight: 700; color: var(--brand); white-space: nowrap; }
    .qm-empty { text-align: center; padding: 48px 16px; color: var(--muted); }
    .qm-foot {
      text-align: center; padding: 24px 16px; font-size: .75rem; color: var(--muted);
    }
    .qm-foot a { color: var(--ink); font-weight: 600; }
    .qm-order-cta {
      display: block; margin: 8px 16px 0; text-align: center; background: var(--brand); color: #fff;
      border-radius: 14px; padding: 14px; font-weight: 700; text-decoration: none;
    }
  </style>
</head>
<body>
  <header class="qm-top">
    <div class="qm-logo" id="qmLogo">?</div>
    <div>
      <h1 id="qmName">Menu</h1>
      <p id="qmSub">Digital menu · prices only</p>
    </div>
  </header>
  <p class="qm-banner">This is a <strong>QR digital menu</strong> — browse prices here. To place an order online, use the restaurant’s ordering link.</p>
  <a class="qm-order-cta" id="qmOrderLink" href="#" style="display:none">Order online instead</a>
  <main class="qm-main" id="qmMain">
    <p class="qm-empty">Loading menu…</p>
  </main>
  <footer class="qm-foot">Powered by <a href="/">Leva</a></footer>
  <script src="/js/tenant.js"></script>
  <script src="/js/qr-menu.js"></script>
</body>
</html>
