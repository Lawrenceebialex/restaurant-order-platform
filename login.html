<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in · Leva</title>
<meta name="theme-color" content="#ffffff" />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{--bg:#fff;--soft:#f4f4f3;--ink:#000;--mute:#5d5d5d;--line:#e3e3e1;--d:'Bricolage Grotesque',sans-serif;--b:'Geist',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
body{font-family:var(--b);background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.top{max-width:440px;margin:0 auto;padding:22px 20px 0;width:100%;display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--d);font-weight:800;font-size:22px;letter-spacing:-.04em}
.logo i{width:26px;height:26px;border-radius:8px;background:var(--ink);display:grid;place-items:center}
.logo i::after{content:"";width:10px;height:10px;border-radius:50%;background:#fff}
.top a.muted{font-size:14px;font-weight:600;color:var(--mute)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:28px 16px 48px}
.card{width:100%;max-width:400px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:36px 28px;box-shadow:0 20px 50px -28px rgba(0,0,0,.12)}
h1{font-family:var(--d);font-size:1.6rem;font-weight:800;letter-spacing:-.03em;margin-bottom:8px}
.lead{color:var(--mute);font-size:.95rem;margin-bottom:22px;line-height:1.5}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field{margin-bottom:14px}
input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:1rem;font-family:inherit;background:#fff}
input:focus{outline:2px solid rgba(0,0,0,.12);border-color:#111}
.tabs{display:flex;gap:6px;margin-bottom:18px}
.tabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;color:var(--mute)}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.panel{display:none}.panel.on{display:block}
.btn{width:100%;margin-top:8px;background:var(--ink);color:#fff;border:none;border-radius:999px;padding:14px;font-weight:700;cursor:pointer;font-family:inherit;font-size:15px}
.btn:disabled{opacity:.6}
.error{color:#b91c1c;font-size:.88rem;margin-top:12px;text-align:center;display:none}
.hint{margin-top:18px;font-size:.85rem;color:var(--mute);text-align:center}
.hint a{font-weight:600;text-decoration:underline;text-underline-offset:3px}
.slug-row{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.slug-row span{padding:12px 10px;background:var(--soft);font-size:.8rem;color:var(--mute)}
.slug-row input{border:none;border-radius:0}
</style>
</head>
<body>
<div class="top">
<a class="logo" href="/"><i></i>leva</a>
<a class="muted" href="/signup">Sign up</a>
</div>
<main>
<div class="card">
<h1>Log in</h1>
<p class="lead">Owners open the dashboard. Kitchen staff use the restaurant link and password.</p>
<div class="tabs">
<button type="button" class="on" data-tab="owner">Owner</button>
<button type="button" data-tab="kitchen">Kitchen</button>
</div>
<form id="ownerForm" class="panel on">
<div class="field"><label for="email">Email</label><input id="email" type="email" required autocomplete="email" placeholder="you@restaurant.com" /></div>
<div class="field"><label for="password">Password</label><input id="password" type="password" required minlength="6" autocomplete="current-password" /></div>
<button type="submit" class="btn" id="ownerBtn">Open dashboard</button>
</form>
<form id="kitchenForm" class="panel">
<div class="field"><label for="slug">Restaurant link</label>
<div class="slug-row"><span>/food/</span><input id="slug" type="text" placeholder="your-kitchen" autocomplete="username" /></div></div>
<div class="field"><label for="kpass">Kitchen password</label><input id="kpass" type="password" minlength="6" autocomplete="current-password" /></div>
<button type="submit" class="btn" id="kitchenBtn">Open kitchen</button>
</form>
<p class="error" id="err"></p>
<p class="hint">No account yet? <a href="/signup">Sign up</a></p>
</div>
</main>
<script>
document.querySelectorAll(".tabs button").forEach(function(b){
b.onclick=function(){
document.querySelectorAll(".tabs button").forEach(function(x){x.classList.remove("on")});
b.classList.add("on");
document.getElementById("ownerForm").classList.toggle("on",b.dataset.tab==="owner");
document.getElementById("kitchenForm").classList.toggle("on",b.dataset.tab==="kitchen");
};
});
function showErr(m){var e=document.getElementById("err");e.textContent=m;e.style.display="block"}
document.getElementById("ownerForm").onsubmit=async function(e){
e.preventDefault();var btn=document.getElementById("ownerBtn");btn.disabled=true;
try{
var res=await fetch("/api/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value})});
var data=await res.json();if(!res.ok)throw new Error(data.error||"Login failed");
sessionStorage.setItem("leva_owner_token",data.token);
sessionStorage.setItem("leva_owner_email",data.account.email);
sessionStorage.setItem("leva_owner_name",data.account.name||"");
sessionStorage.setItem("leva_owner_id",data.account.id||"");
if(data.restaurants&&data.restaurants[0])sessionStorage.setItem("leva_staff_slug",data.restaurants[0].slug);
location.href="/dashboard";
}catch(ex){showErr(ex.message);btn.disabled=false}
};
document.getElementById("kitchenForm").onsubmit=async function(e){
e.preventDefault();var btn=document.getElementById("kitchenBtn");btn.disabled=true;
var slug=document.getElementById("slug").value.toLowerCase().trim().replace(/[^a-z0-9-]/g,"");
try{
var res=await fetch("/api/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({slug:slug,password:document.getElementById("kpass").value})});
var data=await res.json();if(!res.ok)throw new Error(data.error||"Login failed");
sessionStorage.setItem("leva_staff_token_"+data.slug,data.token);
sessionStorage.setItem("leva_staff_token",data.token);
sessionStorage.setItem("leva_staff_slug",data.slug);
location.href="/staff.html?slug="+encodeURIComponent(data.slug);
}catch(ex){showErr(ex.message);btn.disabled=false}
};
</script>
</body>
</html>
