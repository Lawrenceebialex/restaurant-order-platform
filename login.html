<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff login | Leva Food</title>
  <meta name="description" content="Log in to your restaurant staff dashboard on Leva." />
  <meta name="theme-color" content="#1a4d3e" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f5f2eb;
      --surface: #faf8f4;
      --ink: #14120f;
      --muted: #6b6560;
      --border: #e6e0d6;
      --accent: #1a4d3e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    .top {
      max-width: 420px;
      margin: 0 auto;
      padding: 20px 18px 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .top img { height: 28px; width: auto; display: block; }
    .top a.muted { font-size: 0.85rem; font-weight: 600; color: var(--muted); }
    .top a.muted:hover { color: var(--ink); }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 40px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 24px;
      box-shadow: 0 12px 40px rgba(20,18,15,0.06);
    }
    .card h1 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }
    .lead {
      color: var(--muted);
      font-size: 0.92rem;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .field { margin-bottom: 16px; }
    .slug-row {
      display: flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
    }
    .slug-prefix {
      padding: 12px 10px;
      background: #f3f0ea;
      font-size: 0.82rem;
      color: var(--muted);
      white-space: nowrap;
      font-weight: 500;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 1rem;
      font-family: inherit;
      background: #fff;
    }
    .slug-row input {
      border: none;
      border-radius: 0;
      flex: 1;
      min-width: 0;
    }
    input:focus {
      outline: 2px solid rgba(26,77,62,0.2);
      border-color: var(--accent);
    }
    .slug-row:focus-within {
      outline: 2px solid rgba(26,77,62,0.2);
      border-color: var(--accent);
    }
    .pass-row {
      display: flex;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .pass-row input {
      border: none;
      border-radius: 0;
      flex: 1;
    }
    .pass-toggle {
      border: none;
      background: #f3f0ea;
      padding: 12px 14px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      font-family: inherit;
      color: var(--ink);
    }
    .btn {
      width: 100%;
      margin-top: 8px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 14px 18px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      font-family: inherit;
    }
    .btn:hover { background: #143d32; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .error {
      color: #b91c1c;
      font-size: 0.88rem;
      margin-top: 14px;
      text-align: center;
      display: none;
    }
    .hint {
      margin-top: 20px;
      font-size: 0.82rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }
    .hint a { color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
  <div class="top">
    <a href="/"><img src="https://i.ibb.co/1GSR9HNV/1000622428-removebg-preview.png" alt="Leva" /></a>
    <a class="muted" href="/join">Create a page</a>
  </div>
  <main>
    <div class="card">
      <h1>Staff login</h1>
      <p class="lead">Enter your restaurant link and the password you set when you joined. You will land in your own dashboard.</p>
      <form id="loginForm" novalidate>
        <div class="field">
          <label for="slug">Your page link</label>
          <div class="slug-row">
            <span class="slug-prefix">/food/</span>
            <input type="text" id="slug" name="slug" required placeholder="your-kitchen" autocomplete="username" autocapitalize="off" />
          </div>
        </div>
        <div class="field">
          <label for="password">Staff password</label>
          <div class="pass-row">
            <input type="password" id="password" name="password" required minlength="6" autocomplete="current-password" placeholder="Your staff password" />
            <button type="button" class="pass-toggle" id="togglePass">Show</button>
          </div>
        </div>
        <button type="submit" class="btn" id="loginBtn">Open dashboard</button>
        <p class="error" id="loginError"></p>
      </form>
      <p class="hint">
        Forgot the link? Check the email you used at signup, or open your ordering page menu and tap Staff dashboard.<br />
        <a href="/join">New restaurant? Create your page</a>
      </p>
    </div>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var pre = (params.get("slug") || "").toLowerCase().trim();
      if (pre) document.getElementById("slug").value = pre;

      document.getElementById("togglePass").onclick = function () {
        var input = document.getElementById("password");
        var show = input.type === "password";
        input.type = show ? "text" : "password";
        this.textContent = show ? "Hide" : "Show";
      };

      document.getElementById("loginForm").onsubmit = async function (e) {
        e.preventDefault();
        var slug = document.getElementById("slug").value.toLowerCase().trim().replace(/[^a-z0-9-]/g, "");
        var password = document.getElementById("password").value;
        var err = document.getElementById("loginError");
        var btn = document.getElementById("loginBtn");
        err.style.display = "none";
        if (!slug || !password) {
          err.textContent = "Enter your link and password";
          err.style.display = "block";
          return;
        }
        btn.disabled = true;
        btn.textContent = "Checking…";
        try {
          var res = await fetch("/api/auth", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password: password, slug: slug }),
          });
          var data = await res.json();
          if (!res.ok) throw new Error(data.error || "Incorrect password");
          var token = data.token;
          var scope = (data.slug || slug).toLowerCase();
          sessionStorage.setItem("leva_staff_token_" + scope, token);
          sessionStorage.setItem("leva_staff_token", token);
          sessionStorage.setItem("leva_staff_slug", scope);
          location.href = "/staff.html?slug=" + encodeURIComponent(scope);
        } catch (ex) {
          err.textContent = ex.message || "Login failed";
          err.style.display = "block";
          btn.disabled = false;
          btn.textContent = "Open dashboard";
        }
      };
    })();
  </script>
</body>
</html>
