<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up · Leva</title>
  <meta name="theme-color" content="#1a4d3e" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#f5f2eb; --ink:#14120f; --muted:#6b6560; --border:#e6e0d6; --accent:#1a4d3e; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; display: flex; flex-direction: column; }
    a { color: inherit; text-decoration: none; }
    .top { max-width: 420px; margin: 0 auto; padding: 20px 18px 0; width: 100%; display: flex; justify-content: space-between; align-items: center; }
    .top img { height: 28px; }
    .top a.muted { font-size: .85rem; font-weight: 600; color: var(--muted); }
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 16px 40px; }
    .card { width: 100%; max-width: 400px; background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 32px 24px; box-shadow: 0 12px 40px rgba(0,0,0,.06); }
    h1 { font-size: 1.35rem; font-weight: 700; margin-bottom: 6px; }
    .lead { color: var(--muted); font-size: .92rem; margin-bottom: 22px; line-height: 1.5; }
    label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: 6px; }
    .field { margin-bottom: 14px; }
    input { width: 100%; border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; font-size: 1rem; font-family: inherit; }
    input:focus { outline: 2px solid rgba(26,77,62,.2); border-color: var(--accent); }
    .btn { width: 100%; margin-top: 8px; background: var(--accent); color: #fff; border: none; border-radius: 999px; padding: 14px; font-weight: 700; font-size: .95rem; cursor: pointer; font-family: inherit; }
    .btn:disabled { opacity: .6; }
    .error { color: #b91c1c; font-size: .88rem; margin-top: 12px; text-align: center; display: none; }
    .hint { margin-top: 18px; font-size: .82rem; color: var(--muted); text-align: center; }
    .hint a { color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
  <div class="top">
    <a href="/"><img src="https://i.ibb.co/1GSR9HNV/1000622428-removebg-preview.png" alt="Leva" /></a>
    <a class="muted" href="/login">Log in</a>
  </div>
  <main>
    <div class="card">
      <h1>Create your account</h1>
      <p class="lead">Sign up to open your dashboard. You create your ordering page and QR menu <strong>inside</strong> the dashboard — not on the public site.</p>
      <form id="signupForm">
        <div class="field">
          <label for="name">Your name</label>
          <input id="name" type="text" autocomplete="name" placeholder="Ada" />
        </div>
        <div class="field">
          <label for="email">Work email *</label>
          <input id="email" type="email" required autocomplete="email" placeholder="you@restaurant.com" />
        </div>
        <div class="field">
          <label for="password">Password * (6+ characters)</label>
          <input id="password" type="password" required minlength="6" autocomplete="new-password" />
        </div>
        <button type="submit" class="btn" id="btn">Create account</button>
        <p class="error" id="err"></p>
      </form>
      <p class="hint">Already have an account? <a href="/login">Log in to your dashboard</a></p>
    </div>
  </main>
  <script>
    document.getElementById("signupForm").onsubmit = async function (e) {
      e.preventDefault();
      var err = document.getElementById("err");
      var btn = document.getElementById("btn");
      err.style.display = "none";
      btn.disabled = true;
      btn.textContent = "Creating…";
      try {
        var res = await fetch("/api/signup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: document.getElementById("name").value.trim(),
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value,
          }),
        });
        var data = await res.json();
        if (!res.ok) throw new Error(data.error || "Signup failed");
        sessionStorage.setItem("leva_owner_token", data.token);
        sessionStorage.setItem("leva_owner_email", data.account.email);
        sessionStorage.setItem("leva_owner_name", data.account.name || "");
        sessionStorage.setItem("leva_owner_id", data.account.id || "");
        location.href = "/dashboard";
      } catch (ex) {
        err.textContent = ex.message || "Could not sign up";
        err.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Create account";
      }
    };
  </script>
</body>
</html>
